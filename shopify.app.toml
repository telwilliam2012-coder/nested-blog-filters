# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "eb3913f8d3e7dafd2231e5c920b97eb5"
name = "Nested Blog Filters"
handle = "nested-blog-filters-search"
application_url = "https://nested-blog-filters.onrender.com"
embedded = true

# Listing URLs are configured in Shopify Partners, not as TOML settings:
# privacy_policy_url = "https://nested-blog-filters.onrender.com/privacy"
# tos_url = "https://nested-blog-filters.onrender.com/tos"

# Managed pricing plans: Shopify pricing dashboard. Local check: app/shopify.server.ts.

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products, read_products, read_content, write_content, write_app_proxy"
optional_scopes = [ ]
use_legacy_install_flow = false

[app_proxy]
url = "https://nested-blog-filters.onrender.com/proxy/nested-filters"
prefix = "apps"
subpath = "nested-filters"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/api/webhooks"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/api/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[events]
api_version = "2026-10"

  [[events.subscription]]
  handle = "product-price-change"
  topic = "Product"
  actions = [ "update" ]
  triggers = [ "product.variants.price", "product.variants.compareAtPrice" ]
  uri = "/webhooks/products/update"
  query = """
  query product_variant_price_change($productId: ID!, $variantsId: ID!) {\r
    product(id: $productId) {\r
      id\r
      title\r
      status\r
    }\r
    productVariant(id: $variantsId) {\r
      id\r
      title\r
      price\r
      compareAtPrice\r
    }\r
  }\r
  """
  query_filter = "product.status:'ACTIVE'"

[auth]
redirect_urls = [
  "https://nested-blog-filters.onrender.com/auth/callback",
  "https://nested-blog-filters.onrender.com/auth/shopify/callback"
]

[build]
automatically_update_urls_on_dev = false
